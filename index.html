<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Websocket Live Test Rig</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        padding: 20px;
        background-color: #121212;
        color: #ffffff;
      }
      #log {
      background-color: #000;
        padding: 10px;
        border-radius: 5px;
        height: 300px;
        overflow-y: auto;
        border: 1px solid #333;
      }
      .status-on {
        color: #00ff00;
      }
      .status-off {
        color: #ff0000;
      }
    </style>
  </head>
  <body>
    <h1>Websocket Broadcast Console</h1>
    <p id="status" class="status-off">Connecting...</p>
    <form id="message-form">
      <input type="text" id="message-input" placeholder="Type a message..." />
      <button type="submit">Send</button>
    </form>

    <h3>Live stream logs</h3>
    <div id="log"></div>

    <script>
      const statusEl = document.getElementById('status');
      const log = document.getElementById('log');
      const input = document.getElementById('message-input');

      // 1. Initiate the Handshake
      const socket = new WebSocket('ws://localhost:8080');

      const appendLog = (label, message) => {
        const entry = `${new Date().toLocaleTimeString()}
        ${label} ${message}\n`
        log.textContent = entry + log.textContent;
      }

      socket.addEventListener('open', () => {
        statusEl.textContent = 'CONNECTED: ws://localhost:8080';
        statusEl.className = 'status-on';
        appendLog('[SYSTEM]', 'Tunnel Established');
      });

      socket.addEventListener('close', () => {
        statusEl.textContent = 'DISCONNECTED';
        statusEl.className = 'status-off';
        appendLog('[SYSTEM]', 'Tunnel Collapsed');
      })

      socket.addEventListener('message', (event) => {
        appendLog('[RECEIVED]', event.data);
      });

      document.getElementById("message-form")
      .addEventListener('submit', (e) => {
        e.preventDefault();

        if(socket.readyState !== WebSocket.OPEN) {
          appendLog('[ERROR]', 'No active tunnel found');
        }

        const msg = input.value.trim();
        socket.send(msg);
        appendLog('[SENT]', msg);
        input.value = '';
      })
    </script>
  </body>
</html>
